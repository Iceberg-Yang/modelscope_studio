# 唯一配置：首帧参考图 + Prompt。启动时只读此文件。
#
# default_prompt — 全局默认 prompt；支持 .json 文件路径（读取 scene_static）或直接字符串；
#                  条目省略 prompt 时继承此值
# default_index — 启动时选中的条目序号（从 0 起）
#
# groups[].items[]:
#   image — 图片路径（相对于 web_client/）
#   prompt — 支持 .json 文件路径（读取 scene_static）或直接字符串；省略则用 default_prompt
#   label — 可选，画廊标题

default_index: 0

default_prompt: "A realistic outdoor world scene with a navigable path, natural lighting, detailed ground texture, and stable forward motion."

groups:
  - name: example
    items:
      - image: datasets/images/example.png
        prompt: "A rugged male adventurer seen from behind stands at the center of a vast ruined sandstone temple, surrounded by towering carved columns, collapsed lintels, broken masonry, and creeping green vines. A broad stone path leads deeper into the ancient complex, scattered with rocks and glinting gold coins, while monumental pillars frame the route on both sides. Warm late-afternoon sunlight pours through the open roof and fractured architecture, casting long directional shadows and illuminating suspended dust in the air. Weathered reliefs, chipped edges, trailing foliage, and sun-bleached stone create a richly textured archaeological environment. The third-person composition is centered behind the explorer at human height, with a clear navigable path extending forward into the ruins and a cinematic adventure-game aesthetic."
        label: example
      - image: datasets/images/example_first.jpg
        prompt: "A modest, single-story suburban house with weathered stucco walls, a low-pitched shingled roof, and striped awnings over the windows sits behind a sagging chain-link fence, flanked by overgrown shrubs and a mature palm tree; distant glass-and-steel skyscrapers pierce the hazy skyline, contrasting sharply with the sun-bleached, faded earth tones of the foreground. The street is lined with cracked concrete sidewalks, utility poles strung with overhead wires, and scattered debris, while a rusted sedan rests beside a garage under a row of tall palms. Adjacent commercial structures feature peeling signage—“Beer • Wine” and a vintage “Busch” billboard—above corrugated metal facades, all bathed in bright, diffused daylight that casts soft shadows and emphasizes textures of aged paint, dry grass, and worn asphalt. The overall aesthetic evokes a sun-drenched, slightly neglected urban fringe, where mid-century residential architecture meets fading commercial infrastructure under a pale blue sky."
        label: 城郊小院
  - name: showcase
    items:
      - image: datasets/images/84b90ad568b693d2.png
        prompt: "A lone traveler in a flowing white thawb and wrapped headscarf is seen from behind, walking barefoot through a shallow, crystal-clear river that winds across a sunlit desert valley. He carries a simple wooden staff in one hand as ripples and small splashes form around his feet. Rugged ochre cliffs and boulder-strewn banks rise on both sides of the water, dotted with dry grasses, scrub, and clusters of date palms, while vast golden dunes stretch toward hazy mountains in the distance. Bright midday sunlight produces crisp natural shadows and brings out the textures of wet stones, transparent water, weathered rock, and pale fabric. The centered third-person view follows the river forward, creating a stable, open route through the arid oasis landscape."
        label: 004_第三人称沙漠河谷行走
      - image: datasets/images/20fee71742eed3c0.png
        prompt: "A narrow dirt footpath runs forward through an expansive high-altitude meadow covered with short green grass, low alpine shrubs, scattered stones, and small purple and yellow wildflowers. The trail gently curves across the open plateau toward a dramatic chain of blue-gray mountains, whose rocky ridges and sparse patches of lingering snow form layered silhouettes in the distance. A deep valley opens to the left beneath a wide, clear blue sky with a few soft white clouds. Clean daylight, crisp mountain air, and restrained natural colors reveal fine textures in the grass, gravel, and exposed rock. The scene is composed from a first-person eye-level perspective with no visible character, keeping the path centered and unobstructed for stable forward exploration."
        label: 007_第一人称高山草甸小径
      - image: datasets/images/960a962e0e710275.png
        prompt: "A clear forest stream flows gently through a lush, shaded woodland, crossed by a sequence of broad, irregular stepping stones that form a natural path from the foreground to the opposite bank. Sunlight filters through a dense canopy of mature trees, creating shifting highlights across transparent turquoise water, wet stone surfaces, moss-covered roots, and the leaf-littered ground. Large dark boulders rise along the banks among ferns, vines, grasses, and patches of vivid green moss, while a narrow earthen trail continues uphill beyond the final stones. The water is shallow enough to reveal pebbles beneath its rippled surface. The first-person eye-level composition places the stepping-stone route directly ahead, creating a calm, photorealistic and clearly navigable woodland environment."
        label: 010_第一人称林间溪流踏石
      - image: datasets/images/fe7d590734555ed0.png
        prompt: "An Arctic explorer in a bright orange insulated survival suit is seen from behind, standing on a snow-covered riverbank beneath an immense display of green and violet aurora borealis. A partially frozen river curves into the distant polar plain, its dark glassy surface reflecting the luminous ribbons overhead. Beside the explorer, a camera rests on a tripod near lichen-covered rocks, a metal thermos, and a cup; on the opposite side, a small red fox sits near a wooden signpost pointing toward Tromsø and Nordkapp. Frosted tracks and wind-shaped snow add texture to the foreground, while low mountains line the horizon under a star-filled night sky. The centered third-person composition and open frozen route create a vivid, navigable polar expedition scene with crisp moonlit detail."
        label: memory_3rd_data_Landscape_0055
      - image: datasets/images/8a0f99ae390546c4.png
        prompt: "A solitary tan camel is seen from behind, standing on the crest of a high orange sand dune and facing an immense desert of rolling dunes that extends uninterrupted to the horizon. Its coarse fur, long legs, tail, and gently curved neck are sharply defined against the smooth wind-sculpted sand, while a strong shadow falls to the left across the dune slope. Repeating ridgelines and shallow valleys create layered patterns of warm amber, burnt orange, and soft gold beneath a pale blue, cloudless sky. The dry atmosphere is clear, with subtle heat haze over the farthest dunes and no vegetation or structures in sight. The centered third-person composition follows directly behind the camel, leaving a broad, stable route forward through the open desert landscape."
        label: physics_3rd_data_Landscape_0010
